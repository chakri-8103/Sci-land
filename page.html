<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cards Grid</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <style>
    .card {
      min-height: 300px;
      transition: transform 0.2s ease-in-out;
    }
    .card:hover {
      transform: scale(1.05);
    }
    .card-body {
      padding: 10px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .card-title {
      font-size: 24px;
      margin-bottom: 8px;
    }
  </style>
</head>

<body>
  <div class="m-4">
    <div class="row justify-content-center">

      <!-- Card 1 -->
      <div class="col-6 col-sm-4 col-md-3 col-lg-2 mb-3">
        <a href="new.html" class="text-decoration-none">
          <div class="card bg-primary text-white h-100">
            <div class="card-body text-center">
              <h6 class="card-title">Sci-land_2k25</h6>
              <p>Description for Page 1</p>
            </div>
          </div>
        </a>
      </div>

      <!-- Card 2 -->
      <div class="col-6 col-sm-4 col-md-3 col-lg-2 mb-3">
        <a href="page2.html" class="text-decoration-none">
          <div class="card bg-success text-white h-100">
            <div class="card-body text-center">
              <h6 class="card-title">Page 2</h6>
              <p>Description for Page 2</p>
            </div>
          </div>
        </a>
      </div>

      <!-- Card 3 -->
      <div class="col-6 col-sm-4 col-md-3 col-lg-2 mb-3">
        <a href="page3.html" class="text-decoration-none">
          <div class="card bg-danger text-white h-100">
            <div class="card-body text-center">
              <h6 class="card-title">Page 3</h6>
              <p>Description for Page 3</p>
            </div>
          </div>
        </a>
      </div>

      <!-- Card 4 -->
      <div class="col-6 col-sm-4 col-md-3 col-lg-2 mb-3">
        <a href="page4.html" class="text-decoration-none">
          <div class="card bg-warning text-dark h-100">
            <div class="card-body text-center">
              <h6 class="card-title">Page 4</h6>
              <p>Description for Page 4</p>
            </div>
          </div>
        </a>
      </div>

      <!-- Card 5 -->
      <div class="col-6 col-sm-4 col-md-3 col-lg-2 mb-3">
        <a href="page5.html" class="text-decoration-none">
          <div class="card bg-info text-white h-100">
            <div class="card-body text-center">
              <h6 class="card-title">Page 5</h6>
              <p>Description for Page 5</p>

          </div>
        </a>
      </div>

      <!-- Card 6 -->
      <div class="col-6 col-sm-4 col-md-3 col-lg-2 mb-3">
        <a href="page6.html" class="text-decoration-none">
          <div class="card bg-secondary text-white h-100">
            <div class="card-body text-center">
              <h6 class="card-title">Page 6</h6>
              <p>Description for Page 6</p>
            </div>
          </div>
        </a>
      </div>

    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
