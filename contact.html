<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Event Coordinators</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f8f9fa;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        h1,
        h2 {
            color: #28a745;
            font-weight: 600;
            text-align: center;
            margin-bottom: 30px;
            animation: fadeInDown 1s ease-out;
        }

        .header {
            background-color: #fff;
            padding: 30px 0;
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.1);
            margin-bottom: 40px;
        }

        .contacts-container {
            max-width: 1200px;
            margin: 0 auto 50px;
            padding: 0 15px;
        }

        .card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            margin-bottom: 25px;
            overflow: hidden;
            transition: transform 0.3s, box-shadow 0.3s;
            animation: fadeIn 1.5s ease-out;
            border: none;
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }

        .card h3 {
            background: #28a745;
            color: white;
            margin: 0;
            padding: 15px;
            font-size: 1.5rem;
            text-align: center;
        }

        .contact-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: #f9f9f9;
            color: #333;
            border-bottom: 1px solid #eee;
            transition: background 0.3s, color 0.3s;
            cursor: pointer;
        }

        .contact-item:last-child {
            border-bottom: none;
        }

        .contact-item:hover {
            background: #e9ffef;
            color: #28a745;
        }

        .contact-name {
            font-weight: bold;
        }

        .contact-item span {
            font-size: 1rem;
        }

        .contact-us-section {
            background: #212529;
            padding: 50px 0;
            color: white;
        }

        .contact-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 15px;
        }

        .contact-cards {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }

        .contact-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 25px;
            border-radius: 10px;
            width: 300px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            animation: fadeIn 1.5s ease-out;
        }

        .contact-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .contact-card h5 {
            color: #28a745;
            margin-bottom: 15px;
            font-weight: 600;
            font-size: 1.3rem;
        }

        .contact-card p {
            color: #495057;
            margin: 10px 0;
            font-size: 1rem;
        }

        .section-title {
            color: white;
            margin-bottom: 30px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .card {
                width: 100%;
            }

            .contact-card {
                width: 90%;
            }
        }
    </style>
</head>

<body>
    <div class="header">
        <h1 class="animate__animated animate__fadeInDown">Event Coordinators</h1>
    </div>

    <div class="contacts-container">
        <div class="row" id="contactsRow"></div>
    </div>

    <!-- Contact Us Section -->
    <div class="contact-us-section">
        <div class="contact-container">
            <h2 class="section-title text-center">Contact Us</h2>
            <div class="contact-cards">
                <div class="contact-card">
                    <h5>Prasad</h5>
                    <p>📞 +91 9346354212</p>
                    <p>✉️ prasadriskrider@gmail.com</p>
                </div>
                <div class="contact-card">
                    <h5>Chakradhar</h5>
                    <p>📞 +91 7981265187</p>
                    <p>✉️ janapaneedichakradhar678@gmail.com</p>
                </div>
                <div class="contact-card">
                    <h5>Varaprasad</h5>
                    <p>📞 +91 6281726095</p>
                    <p>✉️ kurakulavaraprasad87@gmail.com</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        function openWhatsAppDirect(countryCode, number) {
            const url = `https://wa.me/${countryCode}${number}`;
            window.open(url, '_blank');
        }

        async function loadContacts() {
            const response = await fetch('contacts.txt');
            const text = await response.text();
            const lines = text.trim().split('\n');

            const clubs = {};

            lines.forEach(line => {
                const [club, name, phone] = line.split('|');
                if (!clubs[club]) clubs[club] = [];
                clubs[club].push({ name, phone });
            });

            const contactsRow = document.getElementById('contactsRow');

            Object.entries(clubs).forEach(([clubName, members]) => {
                const card = document.createElement('div');
                card.className = 'col-lg-4 col-md-6';

                const contactHTML = members.map(member => `
  <a href="https://wa.me/91${member.phone}" target="_blank" style="text-decoration: none;">
    <div class="contact-item">
      <span class="contact-name">${member.name}</span>
      <span>📞 ${member.phone}</span>
    </div>
  </a>
`).join('');


                card.innerHTML = `
          <div class="card">
            <h3>${clubName}</h3>
            ${contactHTML}
          </div>
        `;

                contactsRow.appendChild(card);
            });
        }

        loadContacts();
    </script>
</body>

</html>
